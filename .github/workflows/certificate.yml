name: Staging certificate

# The end-to-end proof: a real certificate from Let's Encrypt's staging CA,
# with this plugin answering the dns-01 challenges. Manual only -- it uses a
# real token, writes to a real zone, and registers an ACME account.
on:
  workflow_dispatch:
    inputs:
      domains:
        description: Domains for the certificate, space separated
        required: true
        default: winkler.tel *.winkler.tel
      debug:
        description: Log every ACME.js notification (1 = yes)
        required: false
        default: '0'
      retry_interval:
        description: ACME.js retryInterval in ms (empty = its own 1000)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      # Only this workflow needs @root/acme, and only the unpublished 3.1.1 will
      # do -- see docs/acme-js-incompatibilities.md. It comes from a
      # self-hosted Gitea that is not always reachable, so it is fetched here
      # rather than in package.json, with retries, and it stays out of the way
      # of every other workflow's install.
      - name: install the fixed @root/acme 3.1.1
        run: |
          for attempt in 1 2 3; do
            if npm run acme:fixed; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "git.rootprojects.org did not answer after 3 attempts."
              exit 1
            fi
            echo "attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          node -e "console.log('@root/acme', require('@root/acme/package.json').version)"

      - name: issue a staging certificate
        env:
          EDNS_TOKEN: ${{ secrets.EDNS_TOKEN }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DOMAINS: ${{ inputs.domains }}
          ACME_DEBUG: ${{ inputs.debug }}
          ACME_RETRY_INTERVAL: ${{ inputs.retry_interval }}
        run: |
          for name in EDNS_TOKEN ACME_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "The $name repository secret is not set."
              exit 1
            fi
          done
          # shellcheck disable=SC2086
          node scripts/issue-staging-certificate.js $DOMAINS
